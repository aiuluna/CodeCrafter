<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aries UI 渲染器</title>
    <!-- 预加载关键资源 -->
    <link
      rel="preload"
      href="https://fastly.jsdelivr.net/npm/vue@3.5.13/dist/vue.esm-browser.js"
      as="script"
    />

    <!-- 引入es-module-shims用于支持importmap -->
    <script
      async
      src="https://fastly.jsdelivr.net/npm/es-module-shims@1.8.2/dist/es-module-shims.min.js"
    ></script>

    <!-- 设置importmap -->
    <script type="importmap">
      {
        "imports": {
          "vue": "https://fastly.jsdelivr.net/npm/vue@3.5.13/dist/vue.esm-browser.js",
          "vue/compiler-sfc": "https://fastly.jsdelivr.net/npm/vue@3.5.13/dist/vue.esm-browser.js",
          "@vue/runtime-dom": "https://fastly.jsdelivr.net/npm/vue@3.5.13/dist/runtime-dom.esm-browser.js",
          "@vue/compiler-sfc": "https://fastly.jsdelivr.net/npm/vue@3.5.13/dist/compiler-sfc.esm-browser.js",
          "@vue/shared": "https://fastly.jsdelivr.net/npm/vue@3.5.13/dist/shared.esm-browser.js"
        }
      }
    </script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      }

      #app {
        height: 100%;
        width: 100%;
      }

      /* 移动端适配基础字体大小 */
      html {
        font-size: 50px;
      }

      @media screen and (min-width: 320px) {
        html {
          font-size: calc(50px * (320 / 375));
        }
      }

      @media screen and (min-width: 375px) {
        html {
          font-size: 50px;
        }
      }

      @media screen and (min-width: 414px) {
        html {
          font-size: calc(50px * (414 / 375));
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
